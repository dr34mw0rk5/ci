name: Semgrep

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      configs:
        description: Space-separated semgrep rulesets.
        type: string
        default: p/javascript p/typescript p/security-audit p/nodejs p/owasp-top-ten

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Scan
        env:
          CONFIGS: ${{ inputs.configs }}
        run: |
          set -euo pipefail
          args=()
          for config in $CONFIGS; do args+=(--config "$config"); done
          semgrep ci "${args[@]}"
