name: Semgrep

# Advisory scanners run on PRs only. Re-running them on the push to main is a
# duplicate of the scan the PR already passed — one repo was billing ~4,000
# runs/month for the second copy. New registry rules are picked up by the
# caller's weekly cron instead.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      configs:
        description: Space-separated semgrep rulesets.
        type: string
        default: p/javascript p/typescript p/security-audit p/nodejs p/owasp-top-ten

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # POSIX sh, not bash. The job runs inside semgrep/semgrep, which ships no
      # bash — a bash array here dies with `syntax error: unexpected "("` before
      # the scan starts. Word-splitting $args is the intent, not an oversight:
      # `configs` is space-separated by contract.
      - name: Scan
        shell: sh
        env:
          CONFIGS: ${{ inputs.configs }}
        run: |
          set -eu
          args=""
          for config in $CONFIGS; do args="$args --config $config"; done
          # shellcheck disable=SC2086
          semgrep ci $args
