name: CI (Bun)

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label.
        type: string
        default: ubuntu-latest
      tasks:
        description: >-
          JSON array of {"name": …, "run": …}. Each entry becomes its own job and
          therefore its own required status check, named "<caller-job> / <name>".
        type: string
        default: >-
          [
            {"name": "typecheck", "run": "bun run typecheck --cache-dir=.turbo --concurrency=4"},
            {"name": "lint",      "run": "bunx oxlint --type-aware --threads=4 && bunx oxfmt --check"},
            {"name": "test",      "run": "bun run test --cache-dir=.turbo"},
            {"name": "audit",     "run": "bun audit --audit-level=high"}
          ]
      install-args:
        type: string
        default: --frozen-lockfile --ignore-scripts
      timeout-minutes:
        type: number
        default: 20
      dependency-review:
        description: Run actions/dependency-review-action on pull requests (needs GitHub Advanced Security on private repos).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tasks) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Several checks diff against the merge base; a depth-1 checkout cannot
          # reach it.
          fetch-depth: 0

      - uses: dr34mw0rk5/ci/actions/setup-bun@v1
        with:
          install-args: ${{ inputs.install-args }}
          cache-key: ${{ matrix.name }}

      # Routed through env rather than interpolated into the run body: the command
      # is repo-controlled, but keeping the seam closed costs nothing.
      - name: ${{ matrix.name }}
        env:
          TASK_COMMAND: ${{ matrix.run }}
        run: bash -eo pipefail -c "$TASK_COMMAND"

  dependency-review:
    name: dependency-review
    if: ${{ inputs.dependency-review && github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
