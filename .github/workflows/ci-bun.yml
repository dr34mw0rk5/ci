name: CI (Bun)

on:
  workflow_call:
    inputs:
      runner:
        description: Default runner label. A task may override it with its own "runner" key.
        type: string
        default: ubuntu-latest
      tasks:
        description: >-
          JSON array of {"name": …, "run": …} objects. Each entry becomes its own job and
          therefore its own required status check, named "<caller-job> / <name>".
          Optional per-entry keys: "runner" (override the runner for that one task —
          short checks belong on the cheapest tier), "advisory": "true" (report but do
          not fail the job) and "timeout" (minutes).
        type: string
        default: >-
          [
            {"name": "typecheck", "run": "bun run typecheck --cache-dir=.turbo --concurrency=4"},
            {"name": "lint",      "run": "bunx oxlint --type-aware --threads=4 && bunx oxfmt --check"},
            {"name": "test",      "run": "bun run test --cache-dir=.turbo"},
            {"name": "audit",     "run": "bun audit --audit-level=high"}
          ]
      install-args:
        type: string
        default: --frozen-lockfile --ignore-scripts
      timeout-minutes:
        type: number
        default: 20
      lint-changed:
        description: >-
          Add a `lint` job running oxlint + oxfmt over the files changed against the
          merge base. A repo-wide lint is red on day one in every one of these repos,
          so the enforceable gate is the changed set. No-op on push and merge_group,
          where there is no merge base.
        type: boolean
        default: false
      lint-runner:
        description: Runner for the lint job. Defaults to `runner`; it is compute-bound.
        type: string
        default: ""
      lint-exclude:
        description: Newline-separated extra git pathspecs excluded from the changed-file lint.
        type: string
        default: ""
      dependency-review:
        description: Run actions/dependency-review-action on pull requests (needs GitHub Advanced Security on private repos).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    # A task may pin its own tier: typecheck and lint are compute-bound, while
    # naming/audit/journal-style checks finish in under 30s and belong on the
    # cheapest runner — about half the per-minute price.
    runs-on: ${{ matrix.runner || inputs.runner }}
    timeout-minutes: ${{ matrix.timeout || inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tasks) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Several checks diff against the merge base; a depth-1 checkout cannot
          # reach it.
          fetch-depth: 0

      - uses: dr34mw0rk5/ci/actions/setup-bun@v1
        with:
          install-args: ${{ inputs.install-args }}
          cache-key: ${{ matrix.name }}

      # Routed through env rather than interpolated into the run body: the command
      # is repo-controlled, but keeping the seam closed costs nothing.
      #
      # `advisory` exists for backlogs that would wedge every PR on day one — an
      # audit against 50 transitive advisories, a typecheck seam that is being
      # fixed. It reports in the log and stays green. Never put an advisory task
      # in a required-check set or a release gate: it cannot fail.
      - name: ${{ matrix.name }}
        continue-on-error: ${{ matrix.advisory == true || matrix.advisory == 'true' }}
        env:
          TASK_COMMAND: ${{ matrix.run }}
        run: bash -eo pipefail -c "$TASK_COMMAND"

  lint:
    name: lint
    if: ${{ inputs.lint-changed }}
    runs-on: ${{ inputs.lint-runner || inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: dr34mw0rk5/ci/actions/setup-bun@v1
        with:
          install-args: ${{ inputs.install-args }}
          cache-key: lint

      - uses: dr34mw0rk5/ci/actions/lint-changed@v1
        with:
          exclude: ${{ inputs.lint-exclude }}

  dependency-review:
    name: dependency-review
    if: ${{ inputs.dependency-review && github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
