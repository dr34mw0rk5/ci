name: Verify release

# For deploy targets we do not drive from Actions — Vercel's git integration, or a
# Coolify app redeployed by something else. Vercel builds independently of Actions,
# so a red CI does not stop a production deploy; branch protection is the gate and
# this workflow is the receipt.
#
# The logic lives in actions/verify-release, so a workflow that already has a
# deploy job can verify in-place with the same code instead of copying it.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      release-urls:
        description: Newline-separated /version endpoints that must report the SHA.
        type: string
        required: true
      smoke-urls:
        description: Newline-separated URLs that must answer 200 once the release is live.
        type: string
        default: ""
      expected-version:
        type: string
        default: ${{ github.sha }}
      timeout-seconds:
        type: string
        default: "900"

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: dr34mw0rk5/ci/actions/verify-release@v1
        with:
          expected-version: ${{ inputs.expected-version }}
          release-urls: ${{ inputs.release-urls }}
          smoke-urls: ${{ inputs.smoke-urls }}
          timeout-seconds: ${{ inputs.timeout-seconds }}
