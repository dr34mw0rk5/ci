name: CI (pnpm)

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      tasks:
        description: >-
          JSON array of {"name", "run"} objects. One job, and therefore one status
          check, per entry. Optional per-entry keys: "runner", "advisory": "true"
          (report but do not fail) and "timeout" (minutes).
        type: string
        default: >-
          [
            {"name": "typecheck", "run": "pnpm turbo run typecheck"},
            {"name": "lint",      "run": "pnpm turbo run lint"},
            {"name": "format",    "run": "pnpm exec oxfmt --check"},
            {"name": "test",      "run": "pnpm turbo run test"},
            {"name": "audit",     "run": "pnpm audit --audit-level high"},
            {"name": "workspace", "run": "pnpm dlx sherif@1"}
          ]
      install-args:
        type: string
        default: --frozen-lockfile
      timeout-minutes:
        type: number
        default: 20
    secrets:
      TURBO_TOKEN:
        description: Turborepo remote cache token. Optional.
        required: false

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || inputs.runner }}
    timeout-minutes: ${{ matrix.timeout || inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tasks) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: dr34mw0rk5/ci/actions/setup-pnpm@v1
        with:
          install-args: ${{ inputs.install-args }}

      # `advisory` exists for backlogs that would wedge every PR on day one — an
      # audit whose findings have never been triaged, a task with no test files
      # yet. It reports in the log and stays green, so it must never appear in a
      # required-check set or a release gate.
      - name: ${{ matrix.name }}
        continue-on-error: ${{ matrix.advisory == true || matrix.advisory == 'true' }}
        env:
          TASK_COMMAND: ${{ matrix.run }}
        run: bash -eo pipefail -c "$TASK_COMMAND"
