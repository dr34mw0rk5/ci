name: Release (Docker → GHCR → Coolify)

# gate → build → deploy → verify.
#
# The caller must be triggered by `workflow_run` on the CI workflow, NOT by
# `push`. A push-triggered release starts in parallel with CI and then has to
# busy-wait for CI's check runs to appear — a `sleep 20` poll loop that bills
# ~13 idle runner-minutes per merge (≈5,500 min/month at one team's merge rate).
# Under `workflow_run` the checks are already decided when this workflow starts,
# so the gate is a single API read.
#
# Two consequences worth knowing:
#
#  * `workflow_run` has no `paths:` filter. The `relevant-paths` input replaces
#    it by diffing against the commit production actually serves — which is
#    better than a path filter, because it self-heals: after a failed rollout
#    the next merge sees the cumulative diff and redeploys.
#
#  * `workflow_run` runs the workflow file from the DEFAULT BRANCH and defaults
#    to checking out the default branch HEAD. Every checkout, image tag and
#    rollout comparison must use the triggering run's commit instead. That is
#    what `DEPLOY_SHA` is for; never use `github.sha` in this workflow.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner for the image build. Keep this the large one.
        type: string
        default: ubuntu-latest
      gate-runner:
        description: >-
          Runner for the gate, deploy and verify jobs. These are API-poll and
          I/O bound — give them the smallest tier available.
        type: string
        default: ubuntu-latest
      required-checks:
        description: Space-separated check-run names that must be green before building. Empty disables the gate (not recommended).
        type: string
        default: typecheck lint test audit
      relevant-paths:
        description: >-
          Space-separated paths that make a release necessary. Diffed against the
          commit production currently serves. Empty means always deploy.
        type: string
        default: ""
      version-url:
        description: >-
          Public /version endpoint used to read the live commit for that diff.
          Required when relevant-paths is set.
        type: string
        default: ""
      images:
        description: >-
          JSON array of images to build:
          [{"name": "server", "image": "ghcr.io/org/server", "file": "Dockerfile", "target": "runner", "context": "."}]
          Optional per entry: "build-args" (newline-separated), "platforms".
        type: string
        required: true
      sha-build-args:
        description: >-
          Space-separated extra build-arg NAMES that receive the deploy SHA, for
          images whose Dockerfile reads it under its own name (PRAXLY_RELEASE,
          SENTRY_RELEASE, …). `GIT_SHA` is always passed. A name here, not a
          value: the value cannot live in `images`, which is static JSON.
        type: string
        default: ""
      moving-tag:
        description: Moving tag applied alongside the immutable :<sha> tag.
        type: string
        default: latest
      blacksmith:
        description: Use the Blacksmith docker builder instead of buildx + GHA cache.
        type: boolean
        default: false
      free-disk-space:
        description: >-
          Reclaim ~30 GB on a GitHub-hosted runner before building. Needed for
          images whose build exhausts the default 14 GB — it fails as an opaque
          "no space left on device" mid-layer. Costs ~2 minutes, so leave it off
          unless a build has actually run out.
        type: boolean
        default: false
      prune-build-cache:
        description: >-
          Prune buildkit cache older than 7 days after each build. On persistent
          (sticky-disk) builders the cache otherwise grows without bound — one
          repo billed 135 GB-months before this was added.
        type: boolean
        default: true
      environment:
        description: GitHub Environment guarding the deploy job.
        type: string
        default: production
      release-urls:
        description: Newline-separated public /version URLs, one per deployed app.
        type: string
        required: true
      smoke-urls:
        description: Newline-separated URLs that must answer 200 after the rollout.
        type: string
        default: ""
      attest:
        description: >-
          Publish build provenance attestations for each image. OFF by default:
          on a private repository the attestation API answers "Feature not
          available for the <org> organization. To enable this feature, please
          upgrade the billing plan, or make this repository public", and the
          build job fails *after* pushing the image — a release that is half
          done. Turn it on for public repos, or once the plan covers it.
        type: boolean
        default: false
    secrets:
      COOLIFY_WEBHOOK_URL:
        required: true
      COOLIFY_TOKEN:
        required: true
    outputs:
      deployed:
        description: "true when a build and deploy actually ran."
        value: ${{ jobs.gate.outputs.deploy }}
      sha:
        description: >-
          The commit that was released. Under workflow_run this is the
          triggering run's head_sha, NOT github.sha — a caller job that runs
          anything against the released image must use this.
        value: ${{ jobs.gate.outputs.sha }}

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    name: gate
    # A cancelled CI run means a newer commit superseded this one; that commit's
    # own CI run triggers its own release. Skipping here also debounces the
    # deploy chains that rapid successive merges would otherwise produce.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ${{ inputs.gate-runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ env.DEPLOY_SHA }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The live-commit diff below needs history to fetch the live commit.
          fetch-depth: 0

      # Under workflow_run the checks are already complete, so this exits on its
      # first pass. The wait only ever engages on a manual workflow_dispatch
      # racing an in-flight CI run.
      - if: inputs.required-checks != ''
        uses: dr34mw0rk5/ci/actions/wait-for-ci@v1
        with:
          checks: ${{ inputs.required-checks }}
          sha: ${{ env.DEPLOY_SHA }}

      # Replaces the `paths:` filter that workflow_run cannot have. Any doubt —
      # unreachable /version, unknown or unfetchable live commit, manual
      # dispatch — falls back to deploying.
      - name: Decide whether a release is needed
        id: decide
        env:
          RELEVANT_PATHS: ${{ inputs.relevant-paths }}
          VERSION_URL: ${{ inputs.version-url }}
        run: |
          set -uo pipefail
          deploy() { echo "deploy=true"  >> "$GITHUB_OUTPUT"; echo "Deploying: $1"; exit 0; }
          skip()   { echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Skipping: $1";  exit 0; }

          [ "${{ github.event_name }}" = "workflow_dispatch" ] && deploy "manual dispatch"
          [ -z "$RELEVANT_PATHS" ] && deploy "no relevant-paths configured"
          [ -z "$VERSION_URL" ] && deploy "no version-url configured"

          body=$(curl --silent --max-time 10 "$VERSION_URL" || true)
          live=$(printf '%s' "$body" | jq -r '.commit // .version // empty' 2>/dev/null || true)
          [ -z "$live" ] && deploy "could not read the live commit from $VERSION_URL"
          [ "$live" = "$DEPLOY_SHA" ] && skip "production already serves $DEPLOY_SHA"

          git fetch --depth=1 origin "$live" 2>/dev/null || deploy "live commit $live is not fetchable"
          changed=$(git diff --name-only "$live" "$DEPLOY_SHA" -- $RELEVANT_PATHS)
          [ -n "$changed" ] && deploy "changes since live commit $live:
          $changed"
          skip "no relevant changes between live commit $live and $DEPLOY_SHA"

  build:
    name: build ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Free disk space
        if: inputs.free-disk-space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-args is composed here rather than inline: `images` is static JSON,
      # so a per-image build-arg cannot carry the deploy SHA.
      - name: Compose build args
        id: args
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          EXTRA_NAMES: ${{ inputs.sha-build-args }}
          MATRIX_ARGS: ${{ matrix.build-args }}
        run: |
          set -euo pipefail
          {
            echo "value<<__BUILD_ARGS__"
            echo "GIT_SHA=${SHA}"
            for name in $EXTRA_NAMES; do echo "${name}=${SHA}"; done
            [ -n "$MATRIX_ARGS" ] && printf '%s\n' "$MATRIX_ARGS"
            echo "__BUILD_ARGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Blacksmith builder
        if: inputs.blacksmith
        uses: useblacksmith/setup-docker-builder@6ff44f8e5255f9d8aa31ef22f7e57a2d926b7da0 # v1

      - name: Setup Buildx
        if: ${{ !inputs.blacksmith }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push (Blacksmith)
        if: inputs.blacksmith
        id: push-blacksmith
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: true
          build-args: ${{ steps.args.outputs.value }}
          tags: |
            ${{ matrix.image }}:${{ needs.gate.outputs.sha }}
            ${{ matrix.image }}:${{ inputs.moving-tag }}

      - name: Build and push (Buildx)
        if: ${{ !inputs.blacksmith }}
        id: push-buildx
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ steps.args.outputs.value }}
          tags: |
            ${{ matrix.image }}:${{ needs.gate.outputs.sha }}
            ${{ matrix.image }}:${{ inputs.moving-tag }}

      # Only meaningful on a persistent builder (Blacksmith sticky disk, a
      # self-hosted runner). Best-effort: a prune failure must not fail a build
      # whose image is already pushed.
      - name: Prune build cache older than 7 days
        if: ${{ inputs.prune-build-cache && inputs.blacksmith }}
        continue-on-error: true
        run: docker buildx prune --force --filter "until=168h"

      - name: Attest provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push-blacksmith.outputs.digest || steps.push-buildx.outputs.digest }}
          push-to-registry: true

  deploy:
    name: deploy
    needs: [gate, build]
    runs-on: ${{ inputs.gate-runner }}
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: dr34mw0rk5/ci/actions/deploy-coolify@v1
        with:
          expected-version: ${{ needs.gate.outputs.sha }}
          release-urls: ${{ inputs.release-urls }}
          smoke-urls: ${{ inputs.smoke-urls }}
          webhook-url: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          token: ${{ secrets.COOLIFY_TOKEN }}
