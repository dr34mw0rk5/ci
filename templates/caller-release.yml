# .github/workflows/release-server.yml — thin caller for a Track A repo.
name: Release Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/**"
      - "Dockerfile"
      - "package.json"
      - "bun.lock"
      - ".env.schema"
      - "docker-compose.prod.yaml"
      - ".github/workflows/release-server.yml"

# NOT keyed on github.ref. One webhook redeploys the whole compose stack, so api
# and web releases must queue behind each other — overlapping redeploys recreate
# the stack twice at once and take production down.
concurrency:
  group: coolify-stack-redeploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: dr34mw0rk5/ci/.github/workflows/release-docker.yml@v1.0.0
    secrets: inherit
    with:
      runner: blacksmith-4vcpu-ubuntu-2404
      blacksmith: true
      required-checks: typecheck test audit migration-journal migrate
      images: >-
        [
          {"name": "server",   "image": "ghcr.io/ORG/server",   "file": "Dockerfile", "target": "runner"},
          {"name": "migrator", "image": "ghcr.io/ORG/migrator", "file": "Dockerfile", "target": "migrator"}
        ]
      release-urls: https://api.example.com/version
      smoke-urls: https://api.example.com/
