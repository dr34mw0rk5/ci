# Drop into .github/dependabot.yml in every Track A repo.
# The `github-actions` ecosystem is the important one: it bumps both the pinned
# action SHAs and the `dr34mw0rk5/ci/...@vX.Y.Z` reusable-workflow refs, which is
# what keeps the shared standard rolling out without a custom sync bot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Semgrep's supply-chain ruleset flags an update config with no quarantine
    # window (dependabot-missing-cooldown), and it is right: without one a
    # compromised release can be auto-proposed minutes after publication.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    # Semgrep's supply-chain ruleset flags an update config with no quarantine
    # window (dependabot-missing-cooldown), and it is right: without one a
    # compromised release can be auto-proposed minutes after publication.
    cooldown:
      # Only default-days is valid outside semver ecosystems.
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    # Semgrep's supply-chain ruleset flags an update config with no quarantine
    # window (dependabot-missing-cooldown), and it is right: without one a
    # compromised release can be auto-proposed minutes after publication.
    cooldown:
      # Only default-days is valid outside semver ecosystems.
      default-days: 7
    schedule:
      interval: weekly
      day: monday
