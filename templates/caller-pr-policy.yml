# .github/workflows/pr-policy.yml — thin caller.
#
# PR-only: the diff-scoped jobs here need a merge base, which push does not have.
# That is fine for whitespace and newly tracked .env files — a branch nobody
# proposes cannot leak them into the default branch.
#
# It is NOT fine for an injected payload, which sits in the tree regardless of
# whether anyone opens a pull request. Those rules now live in
# caller-supply-chain.yml, which runs on push for every branch. Install both.
# Checks: "policy / hygiene", "policy / toolchain".
name: Pull Request Policy

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    uses: dr34mw0rk5/ci/.github/workflows/pr-policy.yml@v1.4.0
    with:
      package-manager: bun
      # Generated files are not reviewed by hand; an `eval(` inside one is not a
      # dropper signal.
      eval-allowlist: "**/*.gen.ts"
