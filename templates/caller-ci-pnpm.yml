# .github/workflows/ci.yml — thin caller for a pnpm + Node repo.
name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: dr34mw0rk5/ci/.github/workflows/ci-pnpm.yml@v1.0.0
    secrets: inherit

  policy:
    uses: dr34mw0rk5/ci/.github/workflows/pr-policy.yml@v1.0.0
    with:
      package-manager: pnpm

  sast:
    uses: dr34mw0rk5/ci/.github/workflows/semgrep.yml@v1.0.0

  verify:
    if: github.event_name == 'push'
    uses: dr34mw0rk5/ci/.github/workflows/verify-release.yml@v1.0.0
    with:
      release-urls: https://example.com/api/version
      smoke-urls: https://example.com/
