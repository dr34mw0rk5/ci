# .github/workflows/ci.yml — thin caller for a pnpm + Node repo.
#
# One caller file per trigger shape — see the note in caller-ci-bun.yml.
name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: dr34mw0rk5/ci/.github/workflows/ci-pnpm.yml@v1.4.1
    # Name the secrets. Never `secrets: inherit` here — this repository is
    # public, so inherit hands it every secret the caller holds for the sake of
    # one cache token. Semgrep's github-actions.security.secrets-inherit rule
    # blocks it, correctly.
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    with:
      # The check appears as "ci / <name>". `advisory` reports without failing —
      # for a backlog that has never been triaged, never for a required check.
      tasks: >-
        [
          {"name": "typecheck", "run": "pnpm turbo run typecheck"},
          {"name": "lint",      "run": "pnpm lint"},
          {"name": "format",    "run": "pnpm exec oxfmt --check"},
          {"name": "test",      "run": "pnpm turbo run test"},
          {"name": "audit",     "run": "pnpm audit --audit-level high", "advisory": "true"}
        ]
