# .github/workflows/ci.yml — thin caller for a Bun repo.
#
# One caller file per trigger shape, NOT one file calling everything. pr-policy
# diffs against the merge base, which does not exist on push or merge_group, and
# semgrep is PR + weekly cron only. Bundling them into this file means the policy
# jobs fail on every push to the default branch.
# See caller-pr-policy.yml, caller-semgrep.yml, caller-db.yml.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: dr34mw0rk5/ci/.github/workflows/ci-bun.yml@v1.2.0
    with:
      runner: blacksmith-4vcpu-ubuntu-2404
      # One entry per required status check. The check appears as "ci / <name>".
      # `runner` per task: short checks belong on the cheapest tier.
      tasks: >-
        [
          {"name": "typecheck", "run": "bun run typecheck --cache-dir=.turbo"},
          {"name": "test",      "run": "bun run test --cache-dir=.turbo", "runner": "blacksmith-2vcpu-ubuntu-2404"},
          {"name": "audit",     "run": "bun audit --audit-level=high",    "runner": "blacksmith-2vcpu-ubuntu-2404"}
        ]
      lint-changed: true
