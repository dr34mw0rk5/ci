name: Setup Bun toolchain
description: Bun pinned from package.json#packageManager, with dependency and turbo caches warmed.

inputs:
  install:
    description: Run bun install.
    default: "true"
  install-args:
    description: Arguments passed to bun install.
    default: --frozen-lockfile --ignore-scripts
  cache-key:
    description: Extra key segment so parallel jobs do not evict each other's turbo cache.
    default: shared
  working-directory:
    description: Directory to install in.
    default: "."

runs:
  using: composite
  steps:
    # The version lives in package.json#packageManager and nowhere else. Hardcoding
    # it in YAML is how a repo ends up running one Bun version in CI and another in
    # its deploy workflow.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Verify the runtime matches the pin
      shell: bash
      run: |
        set -euo pipefail
        expected="$(jq -r '.packageManager // empty' package.json)"
        case "$expected" in
          bun@*) ;;
          *) echo "::error::package.json must pin Bun via packageManager (got '${expected:-none}')"; exit 1 ;;
        esac
        actual="bun@$(bun --version)"
        if [ "$actual" != "$expected" ]; then
          echo "::error::expected $expected, runner has $actual"
          exit 1
        fi
        echo "Bun $actual"

    - name: Cache bun install store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Cache turbo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo
        key: turbo-${{ inputs.cache-key }}-${{ runner.os }}-${{ hashFiles('**/bun.lock', 'turbo.json') }}
        restore-keys: turbo-${{ inputs.cache-key }}-${{ runner.os }}-

    # --ignore-scripts is the supply-chain guard: a compromised transitive package
    # must not get an install-time shell (Shai-Hulud class). Packages that genuinely
    # need a postinstall belong in bunfig.toml `trustedDependencies`, where the
    # allowlist is reviewable in a diff.
    - name: Install
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: bun install $INSTALL_ARGS
